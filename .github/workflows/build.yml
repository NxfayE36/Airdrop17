name: Build AirDrop17

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Theos
        uses: theos/theos-action@v1
        with:
          theos-dir: ${{ github.workspace }}/theos

      - name: Build rootless Debian package
        run: |
          export THEOS=${{ github.workspace }}/theos
          make clean package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - name: Find package
        run: |
          echo "Built packages:"
          find packages -type f -name "*.deb" -print

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: AirDrop17-deb
          path: packages/*.deb
